# Local development database (ADU-CON-02 v3.0 section 13).
#
# PostgreSQL 17 — the version the production managed instance runs (section 18).
# The pgvector image is the official pgvector build ON TOP OF postgres:17, so the
# `vector` extension is available; the other three ship with Postgres itself.
#
# This compose file is local only. Production is managed PostgreSQL on Render
# (Frankfurt, PITR); nothing here provisions anything.

# THE PROJECT NAME IS PINNED (WO-INFRA-002). Compose otherwise takes it from the
# checkout's directory, so the same file run from a clone named differently was a
# different project: a container-name clash with the running stack, and a new,
# empty database volume. `adulis-platform` is the name the existing stack uses.
name: adulis-platform

# One MinIO build for the server AND the one-shot init (it ships mc and a shell),
# pinned by digest. Keep it identical to MINIO_IMAGE in .github/workflows/ci.yml.
x-minio-image: &minio-image cgr.dev/chainguard/minio@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: adulis-postgres
    restart: unless-stopped
    environment:
      # NOT adulis_app. POSTGRES_USER becomes a SUPERUSER, and a superuser
      # bypasses every privilege check in PostgreSQL — so if adulis_app were this
      # role, `verification` and `financial` would be directly readable and every
      # boundary test in this repository would pass while proving nothing.
      # adulis_app is created as an ordinary NOLOGIN role by migration 01.
      POSTGRES_USER: adulis_bootstrap
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: adulis
    ports:
      # Container port is always 5432. The HOST port defaults to 5432 and is
      # overridable, because a developer with a local PostgreSQL already bound to
      # 5432 gets a silent shadow: both listen, the local one answers, and the
      # error is an authentication failure that looks nothing like a port clash.
      # Set POSTGRES_HOST_PORT=5433 (and match DATABASE_URL) when that happens.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - adulis-pgdata:/var/lib/postgresql/data
      # Runs only on first initialisation of an empty data directory.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adulis_bootstrap -d adulis']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # T20 S4 -- the object store the media pipeline was waiting for. MinIO here,
  # Cloudflare R2 in production; the adapter is one class and switching is six
  # environment values (S4.1's test of adapter honesty). Same convention set
  # as postgres above: named container, overridable host port, named volume,
  # healthcheck, restart policy.
  #
  # THE CREDENTIALS ARE LOCAL-DEV FAKES of the local-dev-password class -- a
  # container on a developer's loopback, not a secret. Production credentials
  # exist only in the deployment environment (SR-8's class: never in the
  # repository, never in an order, never in a report).
  #
  # THE IMAGE (WO-INFRA-003). MinIO stopped publishing community images:
  # docker.io/minio/minio now answers 404 and quay.io/minio/minio 401, which is
  # why every CI run from 2026-11-08 died at its first step. Chainguard rebuilds
  # MinIO from source daily (AGPLv3, non-root, amd64 + arm64). Its free tier
  # serves only `latest`, so the digest is the pin: update it deliberately, and
  # in ci.yml in the same commit.
  minio:
    image: *minio-image
    container_name: adulis-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: adulis-local
      MINIO_ROOT_PASSWORD: adulis-local-secret
      # Bucket CORS for the browser's direct PUT (S4.2: CSP and bucket CORS
      # are two different failures with one symptom; this is the CORS half).
      # 5173 is dev; 4173 is the e2e harness's preview port.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    ports:
      - '${MINIO_HOST_PORT:-9000}:9000'
    volumes:
      - adulis-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the two buckets and sets their policies, then exits.
  # The script, and why there are TWO BUCKETS rather than two prefixes, is
  # ops/scripts/minio-init.sh -- the same file CI runs.
  minio-init:
    image: *minio-image
    container_name: adulis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: adulis-local
      MINIO_ROOT_PASSWORD: adulis-local-secret
    volumes:
      - ./ops/scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/minio-init.sh']

# EXPLICIT PHYSICAL NAMES, ONE PER SERVICE (WO-INFRA-002, ISSUE-INFRA-001).
#
# T20 S4 inserted `adulis-miniodata:` between `adulis-pgdata:` and the
# `name: adulis-pgdata` line that belonged to it. The name moved to MinIO, so
# from 2026-09-03 MinIO wrote into the ORIGINAL database volume -- beside the
# old PostgreSQL data directory -- and PostgreSQL silently started over on a new
# project-prefixed volume. Both names are now spelled out so neither can drift:
#
# - adulis-platform_adulis-pgdata is the volume the database has used since
#   2026-09-03. Unchanged: nothing moves.
# - adulis-platform_adulis-miniodata is new. The existing objects are still in
#   the volume called `adulis-pgdata` and are NOT moved automatically: follow
#   docs/infrastructure/WO-INFRA-002-MIGRATION-RUNBOOK.md before or right after
#   the first `docker compose up` with this file, or MinIO starts empty.
# - `adulis-pgdata` itself is no longer referenced. Never delete it without the
#   founder's decision (ISSUE-INFRA-005): it holds the old MinIO objects and the
#   pre-2026-09-03 database.
volumes:
  adulis-pgdata:
    name: adulis-platform_adulis-pgdata
  adulis-miniodata:
    name: adulis-platform_adulis-miniodata
