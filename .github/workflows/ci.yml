# Adulis CI — ADU-CON-02 v3.0 section 16, "every push".
#
# Section 16 specifies the full pipeline. This file runs the stages the
# repository can actually run, and carries the rest as CLEARLY-LABELLED
# COMMENTED STAGES so that the gap between what CI checks today and what section
# 16 demands is visible in the file rather than remembered. Each commented stage
# names the tier and the document that unblocks it.
#
# "Red on any; there is no skip label."

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install → typecheck → lint → test → build → gates
    runs-on: ubuntu-latest

    services:
      postgres:
        # Section 3.2 / section 18: PostgreSQL 17. The pgvector image is the
        # official pgvector build on top of postgres:17, so `vector` is present;
        # the other three extensions ship with Postgres itself.
        image: pgvector/pgvector:pg17
        env:
          # NOT adulis_app. POSTGRES_USER becomes a superuser, and a superuser
          # bypasses every privilege check — so with adulis_app as the container
          # owner, the verification and financial boundaries would be directly
          # readable and every boundary test would pass while proving nothing.
          # adulis_app is created NOLOGIN and non-superuser by migration 01.
          POSTGRES_USER: adulis_bootstrap
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: adulis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adulis_bootstrap -d adulis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://adulis_bootstrap:ci-password@localhost:5432/adulis
      DATABASE_URL_MIGRATE: postgres://adulis_bootstrap:ci-password@localhost:5432/adulis

    steps:
      - uses: actions/checkout@v4
        with:
          # ADU-REPO-01 v1.2 S11.2. The default depth-1 clone has no origin/main
          # ref, so `--filter "...[origin/main]"` below would select NOTHING and
          # the scoped steps would silently pass without running.
          fetch-depth: 0


      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The service container does not run db/init, so create the extensions the
      # same way docker-compose does locally. This is also section 18 step 1.
      - name: Create the four extensions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init/00-extensions.sql

      # ADU-REPO-01 v1.2 S7 - scoped to what changed, plus its dependents.
      #
      # S11.2's two foot-guns, both reproduced here before this was written:
      #   - fetch-depth: 0 above, or origin/main is not a ref and NOTHING is selected
      #   - '!adulis-platform' because THE WORKSPACE ROOT IS SELECTABLE. Any change
      #     outside a package directory selects it, and the root's scripts are
      #     `pnpm -r ...`, so a filtered run would re-enter unfiltered and execute
      #     every package anyway - the scoping silently doing nothing.
      #
      # Verified: without the exclusion the selector returns `.` alongside the six
      # packages; with it, only the six. Lint stays repo-wide (`eslint .`), as do
      # every gate below - they guard invariants no single workstream owns.
      - name: Typecheck (strict, no exceptions)
        run: pnpm --filter "...[origin/main]" --filter '!adulis-platform' typecheck

      - name: Lint
        run: pnpm lint

      # Includes the pooled-connection settings-leak test and the migration-01
      # integration tests, both of which need real PostgreSQL: roles, grants and
      # current_setting's transaction-local behaviour cannot be mocked. Also runs
      # the locale type-level completeness test.
      # ADU-REPO-01 S4 - the four dependency rules. Enforced here rather than in
      # review, because a rule that depends on someone noticing is a rule that
      # holds until the week someone is busy.
      #
      # Run BEFORE Build on purpose: dist/ is doNotFollow'd rather than excluded,
      # so built output stays in the graph as a leaf and an import into it is
      # still catchable. Running before Build simply means there is less of it.
      - name: Dependency rules (ADU-REPO-01 S4)
        run: pnpm verify:deps

      # And prove the rules FIRE. `verify:deps` passing tells you nothing on its
      # own: a config with a typo in a path regex, or with preserveSymlinks left
      # true, passes exactly as loudly as a correct one. This plants each
      # violation, asserts it is caught by name, and removes it.
      - name: The dependency rules actually fire
        run: pnpm verify:deps-fires

      # ADU-REPO-01 v1.2 S5.1. NestJS setGlobalPrefix('v1') prefixes the ROUTES and
      # leaves the Swagger document keys unprefixed - a spec that serves correctly
      # from the real API and 404s against every mocked path. Prism serves what the
      # path keys say. INERT until Tier 3 produces a contract, and loudly so.
      - name: The contract carries /v1 in its path keys
        run: pnpm verify:contract

      - name: Test
        run: pnpm --filter "...[origin/main]" --filter '!adulis-platform' test

      - name: Build
        run: pnpm --filter "...[origin/main]" --filter '!adulis-platform' build

      # ---- Database gates ---------------------------------------------------

      - name: Verify the four extensions (Tier 0 gate)
        run: pnpm db:verify-extensions

      - name: Migrations apply
        run: pnpm db:migrate

      # LIVE from Tier 1. Section 16: "migrations applied twice to empty DBs,
      # schema dumps diffed". ops/scripts/db-determinism.mjs excludes pg_dump
      # 17's per-run random restrict token, which would otherwise make this stage
      # fail on every schema forever — see the script's header.
      - name: Migrations are deterministic
        run: pnpm db:determinism

      # LIVE from Tier 1. ADU-DB-01 v1.8 supplied the fifteenth check (R16) and
      # moved check 14 to 109 tables, so the SPEC_VERSION_GAP that kept this
      # commented at Tier 0 is closed. Checks whose objects belong to a later
      # tier report PENDING and do not fail the build; the harness exits non-zero
      # only on FAIL. Check 15 is what now enforces R16 — see the note below.
      # LIVE from Tier 1. ADU-AUTH-01 v2.3 section 16.6, made executable:
      # "Where a value must survive transit, give it twice in different forms.
      #  Section 16.2 is a table for a human; section 16.2a is SQL for a machine;
      #  both come from one generator. Corruption that damages one is visible
      #  against the other." That is only true if something compares them.
      #
      # v2.2 shipped a matrix whose 252 cells all collapsed to one character in
      # transit and STILL PARSED as a well-formed table. This is the comparison
      # that would have caught it, and it runs before anything is seeded.
      - name: The permission matrix agrees with its own generated SQL
        run: pnpm verify:permission-doc

      - name: Appendix C — sixteen checks
        run: pnpm db:check

      # ---- Static assertions on the build output ----------------------------

      # Section 16: "'unsafe-eval' absent from output". The console's CSP is
      # script-src 'self' with no nonce and no 'unsafe-inline' (section 3.9), and
      # an eval-based build would silently require loosening it.
      - name: Assert 'unsafe-eval' absent from the console build
        run: |
          if grep -rq "unsafe-eval" apps/console/dist/; then
            echo "FAIL: 'unsafe-eval' found in the console build output."
            grep -rn "unsafe-eval" apps/console/dist/ | head -20
            exit 1
          fi
          echo "PASS: 'unsafe-eval' absent from the console build output."

      # The console must ship React's PRODUCTION build. Vite selects it from
      # NODE_ENV, so an ambient NODE_ENV=development — which is what .env.example
      # carries, and what sourcing .env into a shell sets — silently doubles the
      # bundle from 193 kB to 391 kB and ships development warnings to sellers on
      # the metered low-end connections section 23 names as the binding
      # performance constraint. A check rather than a convention, because the
      # build succeeds either way and nothing else would notice.
      - name: Assert the console shipped React's production build
        run: |
          if grep -rq "Each child in a list" apps/console/dist/assets/; then
            echo "FAIL: the console bundle contains React development-only warnings."
            echo "      NODE_ENV was development during the build. It must not be."
            exit 1
          fi
          echo "PASS: console bundle is a production React build."

      # NOTE ON R16. Tier 0 carried a standalone recursive grep of db/ for the
      # forbidden phrase. It is REMOVED, not kept as belt-and-braces: at Tier 1 it
      # began failing on db/checks/check-15-no-materialized-view.mjs, whose
      # comments necessarily contain that phrase in order to explain it. A check
      # that fails on the file whose job is to prevent the thing teaches people to
      # disable the check. Appendix C check 15, run above inside `pnpm db:check`,
      # greps db/migrations/ with SQL comments stripped and is the authoritative
      # enforcement of R16.

      # =====================================================================
      # STAGES REQUIRED BY SECTION 16 THAT THIS TIER CANNOT RUN YET.
      #
      # Each is commented out with the tier and the document that unblocks it.
      # Uncomment as the tier lands — do not delete, and do not "temporarily"
      # skip one once it is live: section 16 is explicit that there is no skip
      # label.
      # =====================================================================

      # --- Integration tests against the full schema -------------------------
      # UNBLOCKED BY: migrations 02-05, which are blocked on ADU-DB-01 v1.9 —
      # see docs/build-status/TIER-1-SPEC-GAPS.md.
      # Migration 01's integration tests already run inside `pnpm test` above.
      #
      # - name: Integration tests
      #   run: pnpm --filter @adulis/api test:integration

      # --- Locale completeness ----------------------------------------------
      # PARTIALLY LIVE: the type-level test in packages/locale already fails the
      # build when an Amharic key is missing, and runs inside `pnpm test` above.
      # The remaining half — that every user-visible string goes through the
      # catalogue at all — needs screens, so it is Tier 4+.
      #
      # - name: Locale completeness (no hard-coded user-visible strings)
      #   run: pnpm --filter @adulis/locale check:usage

      # --- OpenAPI regenerate + additive diff --------------------------------
      # UNBLOCKED BY: Tier 3 (OpenAPI publish).
      # Section 11: "CI diffs the spec against the previous commit and fails on
      # any removal, rename or retype inside /v1" — additive-only becomes a build
      # failure, not a discipline. A hand-edited spec is a lie with authority.
      #
      # - name: Regenerate OpenAPI and fail on non-additive change
      #   run: pnpm --filter @adulis/api openapi:generate && pnpm openapi:diff

      # --- Secret scan -------------------------------------------------------
      # UNBLOCKED BY: choosing a scanner. Section 12: "the real .env never enters
      # git (CI secret-scan enforces)". Left commented rather than implemented
      # with an unreviewed third-party action, since that action would run with
      # repository credentials on every push.
      #
      # - name: Secret scan
      #   run: <scanner to be selected>
