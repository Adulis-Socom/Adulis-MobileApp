# Adulis CI — ADU-CON-02 v3.0 section 16, "every push".
#
# Section 16 specifies the full pipeline. This file runs the stages the
# repository can actually run, and carries the rest as CLEARLY-LABELLED
# COMMENTED STAGES so that the gap between what CI checks today and what section
# 16 demands is visible in the file rather than remembered. Each commented stage
# names the tier and the document that unblocks it.
#
# "Red on any; there is no skip label."

name: CI

# T20 S2.1 -- THE TRIGGER WAS NEVER THE GAP, AND THE RULING'S PREMISE IS
# CORRECTED HERE RATHER THAN SILENTLY DISCHARGED. push: '**' has always
# included main, and the Actions history proves it fired: the merges of #80
# and #81 each produced a RED run on main (2026-09-03 07:10 and 07:12), two
# hours before anyone noticed main was broken -- by hitting it at the start
# of the next order. The gate saw the merged tree; nobody looked at the gate.
#
# So the fix the ruling asked for ("CI runs on push to main") already exists,
# and what it bought is exactly what happened: a red main RECORDED within a
# minute and IGNORED. The stronger fix -- branches current before merge --
# needs branch protection, recorded unenforceable on this plan (ADU-CON-02
# S21). What remains is a human habit with a mechanical aid: the badge in
# README.md points at this workflow's main-branch status, so a red main is
# one glance away rather than one navigation nobody makes.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install → typecheck → lint → test → build → gates
    runs-on: ubuntu-latest

    services:
      postgres:
        # Section 3.2 / section 18: PostgreSQL 17. The pgvector image is the
        # official pgvector build on top of postgres:17, so `vector` is present;
        # the other three extensions ship with Postgres itself.
        image: pgvector/pgvector:pg17
        env:
          # NOT adulis_app. POSTGRES_USER becomes a superuser, and a superuser
          # bypasses every privilege check — so with adulis_app as the container
          # owner, the verification and financial boundaries would be directly
          # readable and every boundary test would pass while proving nothing.
          # adulis_app is created NOLOGIN and non-superuser by migration 01.
          POSTGRES_USER: adulis_bootstrap
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: adulis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adulis_bootstrap -d adulis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL is the RUNTIME credential and carries adulis_app - never a
      # superuser, in any environment, CI included: under a superuser every
      # boundary check passes while proving nothing. The role is provisioned
      # LOGIN by the step after "Migrations apply". Privileged tooling (the
      # extension bootstrap, db:check, db:determinism, fixture-writing suites)
      # uses DATABASE_URL_MIGRATE.
      DATABASE_URL: postgres://adulis_app:ci-password@localhost:5432/adulis
      DATABASE_URL_MIGRATE: postgres://adulis_bootstrap:ci-password@localhost:5432/adulis
      # The WORKER's credential. A different role from adulis_app on purpose
      # (ADU-CON-02 S1, T4 S1.2): the job tests run as adulis_jobs so that a
      # missing grant fails the build rather than surfacing in production.
      DATABASE_URL_JOBS: postgres://adulis_jobs:ci-password@localhost:5432/adulis
      # The three key secrets, FAKE - the suites exercise real AEAD through
      # resolveKey's digest path exactly as local dev does (.env.example's
      # doctrine: fake values only, never a real one).
      EVIDENCE_ENCRYPTION_KEY_V1: ci-fake-evidence-key
      PAYOUT_ENCRYPTION_KEY_V1: ci-fake-payout-key
      IDENTITY_HASH_KEY_V1: ci-fake-identity-key

    steps:
      - uses: actions/checkout@v4
        with:
          # ADU-REPO-01 v1.2 S11.2. The default depth-1 clone has no origin/main
          # ref, so `--filter "...[origin/main]"` below would select NOTHING and
          # the scoped steps would silently pass without running.
          fetch-depth: 0


      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The service container does not run db/init, so create the extensions the
      # same way docker-compose does locally. This is also section 18 step 1.
      - name: Create the four extensions
        run: psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -f db/init/00-extensions.sql

      # graphile-worker's own tables are installed by the DDL role INSIDE the
      # gate run below (`worker:install`), not here: the worker's first
      # statement would otherwise be `create schema if not exists jobs`, which
      # needs CREATE on the DATABASE - a standing privilege the runtime role
      # must not hold (register D-52).
      #
      # ==================================================================
      # THE GATES ARE ONE LIST, AND IT IS NOT IN THIS FILE.
      #
      # Work Order T6 S5.1: "The fix is not to add the missing step to
      # `ci:local`. It is to stop maintaining two lists."
      #
      # There were two. This file ran eighteen gates; root package.json's
      # `ci:local` ran eight. Nothing compared them, so the difference was
      # invisible until a push failed on a gate no local run had - which is
      # how T5 shipped a stale contracts/openapi.json: a summary changed,
      # `ci:local` went green, CI failed on a step `ci:local` did not have.
      #
      # ops/scripts/gates.mjs is now the list, `pnpm ci:local` runs it, and
      # this job runs the SAME script. What stays here is SETUP - checking
      # out, node, pnpm, the extensions, the LOGIN passwords - which differs
      # legitimately between a service container and docker-compose and
      # cannot fail because someone wrote something wrong.
      #
      # ADULIS_SCOPE_FILTER is the one difference, expressed once: on a
      # BRANCH or a PR, CI scopes typecheck/build/test to changed packages
      # plus dependents (ADU-REPO-01 S7); a developer runs everything.
      #
      # ON A PUSH TO MAIN IT IS EMPTY, and that is a correction rather than a
      # refinement. `...[origin/main]` diffs against origin/main, which on a
      # push to main IS the commit being built -- so the selection was empty,
      # pnpm printed "No projects matched the filters", and seven gates
      # (typecheck, lint, build, test, and the three that read the console's
      # dist) exited 0 without running. Main's CI could not go red on a type
      # error, a lint error or a failing test. A branch has a base to diff
      # against; main IS the base, so main gets the whole list.
      #
      # S11.2's two foot-guns still travel with the filter - fetch-depth 0
      # above, or `origin/main` is not a ref and NOTHING is selected; and the
      # script's own `!adulis-platform`, because the workspace root is
      # selectable and its scripts are `pnpm -r`, so a filtered run re-enters
      # unfiltered.
      # ==================================================================
      # Migration 01 creates every role NOLOGIN, because a password in a
      # migration is a secret in git. So the runtime roles cannot be given a
      # LOGIN password until the migrations have run, and `pnpm test` inside
      # the gates cannot connect until they have. Hence this order, and hence
      # `migrate` appearing twice: once here as SETUP, so the roles exist to
      # be provisioned, and once inside the gate list where it belongs as a
      # gate. The second run is a no-op that still asserts node-pg-migrate's
      # record agrees with the files.
      - name: Migrations apply (setup - migration 01 creates the roles)
        run: pnpm db:migrate

      - name: Provision the runtime roles
        run: |
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c "ALTER ROLE adulis_app LOGIN PASSWORD 'ci-password'"
          psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c "ALTER ROLE adulis_jobs LOGIN PASSWORD 'ci-password'"

      # ==================================================================
      # OBJECT STORAGE, because the media path is not optional any more.
      #
      # T20 S4 made "a seller can put a photograph on a product" real, and the
      # console-e2e gate proves it the only way it can be proven: a browser, a
      # real file, three presigned PUTs and a rendered <img>. That needs a
      # store. `verify-console-e2e.mjs` REFUSES TO RUN WITHOUT ONE rather than
      # quietly skipping the media arms -- ADU-CON-02 S16 is explicit that
      # there is no skip label, and a media proof that silently does not run in
      # CI is worse than no proof, because the gate still reports green.
      #
      # A STEP, NOT A `services:` CONTAINER. The official minio image needs
      # `server /data` as its command and GitHub's `services:` cannot set one.
      # Running it here also keeps this identical to docker-compose.yml, which
      # is the point: the adapter cannot tell MinIO from Cloudflare R2, so the
      # six values below are the only difference between this and production.
      # They are local-container credentials, not secrets.
      # ==================================================================
      - name: Start object storage and create the two buckets
        run: |
          docker run -d --name adulis-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=adulis-local \
            -e MINIO_ROOT_PASSWORD=adulis-local-secret \
            -e MINIO_API_CORS_ALLOW_ORIGIN='http://localhost:4173,http://localhost:5173' \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null
          # TWO BUCKETS, because evidence/raw/ is plaintext: the media bucket is
          # public-read and the evidence bucket has no public access at all.
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 adulis-local adulis-local-secret &&
            mc mb --ignore-existing local/adulis-media &&
            mc mb --ignore-existing local/adulis-evidence &&
            mc anonymous set download local/adulis-media &&
            mc ilm rule add local/adulis-evidence --prefix 'evidence/raw/' --expire-days 1 || true
          "

      - name: Gates (ops/scripts/gates.mjs - the same list `pnpm ci:local` runs)
        run: pnpm ci:local
        env:
          # EMPTY ON A PUSH TO MAIN, AND SCOPED EVERYWHERE ELSE.
          #
          # `...[origin/main]` means "the packages changed since origin/main,
          # plus their dependents". On a PUSH TO MAIN that ref IS the commit
          # being built, so the diff is empty, the filter selects nothing, and
          # pnpm prints "No projects matched the filters" and exits 0. Seven
          # gates -- typecheck, lint, build, test and the three that read the
          # console's dist -- were therefore passing on main without running:
          # main's CI could not go red on a type error, a lint error or a
          # failing test, only on the unscoped gates below them.
          #
          # A branch has a base to diff against. Main IS the base, so it gets
          # the whole list.
          #
          # THE SHAPE OF THIS EXPRESSION IS DELIBERATE. The obvious spelling --
          # `(ref == main) && '' || '...[origin/main]'` -- is wrong in GitHub
          # Actions, because the empty string is FALSY there: the `&&` yields
          # '', the `||` then discards it and the filter comes back anyway. The
          # condition is inverted so the empty case is the fallback and nothing
          # depends on '' being truthy.
          ADULIS_SCOPE_FILTER: ${{ github.ref != 'refs/heads/main' && '...[origin/main]' || '' }}
          # The six values the object-store adapter reads. A bare account id
          # would be treated as Cloudflare's; a URL is used verbatim with
          # path-style addressing, which is what MinIO needs.
          R2_ACCOUNT_ID: http://localhost:9000
          R2_ACCESS_KEY_ID: adulis-local
          R2_SECRET_ACCESS_KEY: adulis-local-secret
          R2_MEDIA_BUCKET: adulis-media
          R2_EVIDENCE_BUCKET: adulis-evidence
          R2_MEDIA_PUBLIC_ORIGIN: http://localhost:9000/adulis-media
          # db-determinism shells psql and pg_dump through `docker exec`,
          # because the runner's own client tools are a major behind the
          # server (pg_dump 16 refuses a PG17 server outright). Locally that
          # container is compose's adulis-postgres; here it is the service
          # container, whose generated name GitHub exposes as
          # job.services.<id>.id.
          ADULIS_PG_CONTAINER: ${{ job.services.postgres.id }}

      # =====================================================================
      # STAGES REQUIRED BY SECTION 16 THAT THIS TIER CANNOT RUN YET.
      #
      # Each is commented out with the tier and the document that unblocks it.
      # Uncomment as the tier lands — do not delete, and do not "temporarily"
      # skip one once it is live: section 16 is explicit that there is no skip
      # label.
      # =====================================================================

      # --- Integration tests against the full schema -------------------------
      # UNBLOCKED BY: migrations 02-05, which are blocked on ADU-DB-01 v1.9 —
      # see docs/build-status/TIER-1-SPEC-GAPS.md.
      # Migration 01's integration tests already run inside `pnpm test` above.
      #
      # - name: Integration tests
      #   run: pnpm --filter @adulis/api test:integration

      # --- Locale completeness ----------------------------------------------
      # PARTIALLY LIVE: the type-level test in packages/locale already fails the
      # build when an Amharic key is missing, and runs inside `pnpm test` above.
      # The remaining half — that every user-visible string goes through the
      # catalogue at all — needs screens, so it is Tier 4+.
      #
      # - name: Locale completeness (no hard-coded user-visible strings)
      #   run: pnpm --filter @adulis/locale check:usage

      # --- OpenAPI regenerate + additive diff --------------------------------
      # UNBLOCKED BY: Tier 3 (OpenAPI publish).
      # Section 11: "CI diffs the spec against the previous commit and fails on
      # any removal, rename or retype inside /v1" — additive-only becomes a build
      # failure, not a discipline. A hand-edited spec is a lie with authority.
      #
      # LIVE from Tier 3, and it now runs INSIDE the gate list as
      # `contract-current` - CI regenerates the contract and the committed
      # copy must be byte-identical. It moved there rather than staying here
      # because it is precisely the gate that used to exist only in this file:
      # T5 changed one @ApiOperation summary, `ci:local` went green, and CI
      # failed on a step no local run had. The ADDITIVE-only differ (fail on
      # any removal/rename/retype inside /v1) is still owed - recorded in
      # T3-REPORT.md - and the equality check holds the seam until it lands.

      # --- Secret scan -------------------------------------------------------
      # UNBLOCKED BY: choosing a scanner. Section 12: "the real .env never enters
      # git (CI secret-scan enforces)". Left commented rather than implemented
      # with an unreviewed third-party action, since that action would run with
      # repository credentials on every push.
      #
      # - name: Secret scan
      #   run: <scanner to be selected>
