# TEMPORARY (Batch 02A, SC-FE-01): resolves pnpm-lock.yaml for the new apps/console importer in CI, because heavy
# dependency resolution is deferred locally under the resource policy. It writes NOTHING back: it uploads the
# generated lockfile as an artifact, the lockfile is inspected and committed by a person/agent, and the frozen-lockfile
# jobs of Rebuild CI then verify that committed copy. Removed in the same PR once the lockfile is committed.
name: Console lockfile resolve (temporary)

on:
  push:
    branches: ['rebuild/**']
    paths:
      - 'apps/console/package.json'
      - '.github/workflows/console-lockfile-resolve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: resolve lockfile (artifact only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve (lockfile only, no install)
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: What changed
        run: |
          git --no-pager diff --stat -- pnpm-lock.yaml
          git --no-pager diff --numstat -- pnpm-lock.yaml

      - name: Upload the resolved lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
