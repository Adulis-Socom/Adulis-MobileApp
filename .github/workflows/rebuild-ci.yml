# Rebuild CI -- the replacement lineage's verification pipeline (ARC-BE-05, RB25-D01).
#
# Runs on every push to a rebuild/** branch (EXACT HEAD) and on every pull request into the rebuild
# integration branch, where actions/checkout builds refs/pull/N/merge (the INTEGRATION CANDIDATE: the PR
# merged onto the current base). The legacy pipeline (35 gates over the archived lineage) is preserved at
# tag recovery/legacy-dev-20261125 and is never a pass for replacement code. Red on any step; no skip label.
name: Rebuild CI

on:
  push:
    branches: ['rebuild/**']
  pull_request:
    branches: ['rebuild/2026-11-25']
  workflow_dispatch:

concurrency:
  group: rebuild-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job reads the repository and uploads its own artifacts; it pushes nothing.
permissions:
  contents: read

jobs:
  foundation:
    name: replacement foundation (rebuild-20261125)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # The same image as the local disposable target (ops/rebuild/disposable-db.sh), same database name and
      # host port, so the target guard sees the replacement lineage in both. POSTGRES_USER is the
      # provisioning superuser used ONLY by db:bootstrap and the test harness; migrate, API and worker run
      # as the three non-superuser roles bootstrap creates (the target guard refuses anything else).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rebuild_bootstrap
          POSTGRES_PASSWORD: rebuild-local-only
          POSTGRES_DB: adulis_rebuild
        ports: ['55440:5432']
        options: >-
          --health-cmd "pg_isready -U rebuild_bootstrap -d adulis_rebuild"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # Two Valkey roles (DEPLOY-01 S50): queue (noeviction, the image default) and cache (LRU, set below).
      valkey-queue:
        image: valkey/valkey:8
        ports: ['56379:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
      valkey-cache:
        image: valkey/valkey:8
        ports: ['56380:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30

    env:
      # Fake, local-only credentials for disposable CI services (.env.example rule): not secrets.
      TEST_DATABASE_URL_BOOTSTRAP: postgres://rebuild_bootstrap:rebuild-local-only@127.0.0.1:55440/adulis_rebuild
      QUEUE_VALKEY_URL: redis://127.0.0.1:56379
      CACHE_VALKEY_URL: redis://127.0.0.1:56380

    steps:
      # PINNED BY COMMIT: a tag can be moved to other code; a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record what is being verified (exact head / integration candidate)
        run: |
          {
            echo "### Verified tree"
            echo "- event: ${{ github.event_name }}"
            echo "- checked-out commit: $(git rev-parse HEAD)"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- PR head: ${{ github.event.pull_request.head.sha }}"
              echo "- PR base (${{ github.base_ref }}): ${{ github.event.pull_request.base.sha }}"
              echo "- this is the MERGE RESULT of head onto base (integration candidate)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from the lockfile (clean, frozen)
        run: pnpm install --frozen-lockfile

      - name: Static gates (docs ASCII, disposable-db negative tests, tokens and contrast)
        run: |
          pnpm verify:docs-ascii
          pnpm verify:disposable-db
          pnpm verify:tokens

      - name: Build
        run: pnpm build

      # Generated by the official generators from the BUILT API; uploaded so the committed copies are always
      # generator output. The consistency check itself runs near the end, so one stale copy does not hide
      # every later result.
      - name: Generate OpenAPI contract and typed client
        run: |
          pnpm generate:openapi
          pnpm generate:api-client

      - name: Upload generated contract
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-contract
          path: |
            contracts/openapi.json
            packages/api-client/src/schema.d.ts
          if-no-files-found: error

      - name: Strict type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries (and that the rules fire)
        run: |
          pnpm verify:deps
          pnpm verify:deps-fires

      - name: Unit tests (API platform, locale, api-client types, tokens)
        run: pnpm test

      - name: Configure the cache Valkey as an evicting cache
        run: docker exec ${{ job.services.valkey-cache.id }} valkey-cli CONFIG SET maxmemory-policy allkeys-lru

      # No --forceExit (RB-B01-19): the suite must release every PostgreSQL, Valkey and BullMQ resource itself.
      # A leaked handle keeps Jest alive, so `timeout` turns it into a fast failure instead of a 10-minute hang.
      - name: Integration (clean init, determinism, roles, RLS, target safety, outbox, reconciliation, worker, queue/cache; clean exit)
        timeout-minutes: 10
        run: |
          set -o pipefail
          timeout 180 pnpm test:integration 2>&1 | tee apps/api/integration.log
          if grep -q 'did not exit one second' apps/api/integration.log; then echo 'Jest did not exit cleanly'; exit 1; fi

      - name: Smoke - bootstrap, migrate, API and worker start, health, graceful shutdown
        env:
          ADULIS_DB_MIGRATOR_PASSWORD: migrator-local-only
          ADULIS_DB_API_PASSWORD: api-role-local-only
          ADULIS_DB_WORKER_PASSWORD: worker-role-local-only
        run: |
          set -euo pipefail
          export DATABASE_URL_BOOTSTRAP="$TEST_DATABASE_URL_BOOTSTRAP"
          export DATABASE_URL_MIGRATE="postgres://adulis_migrator:${ADULIS_DB_MIGRATOR_PASSWORD}@127.0.0.1:55440/adulis_rebuild"
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm db:migrate   # idempotent second run
          cd apps/api
          NODE_ENV=production RELEASE=ci CONSOLE_ORIGIN=https://console.adulis.test PORT=3999 \
            DATABASE_URL="postgres://adulis_api:${ADULIS_DB_API_PASSWORD}@127.0.0.1:55440/adulis_rebuild" \
            node dist/main.js > api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/livez >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3999/livez | grep -q '"ok"'
          curl -fsS http://127.0.0.1:3999/healthz | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/v1/anything)" = 404
          kill -TERM "$API_PID"; wait "$API_PID"; echo "api exited $?"
          # The API refuses to run as the superuser.
          if NODE_ENV=production CONSOLE_ORIGIN=https://console.adulis.test PORT=3998 DATABASE_URL="$TEST_DATABASE_URL_BOOTSTRAP" timeout 20 node dist/main.js > api-super.log 2>&1; then
            echo "API started as a superuser"; exit 1
          fi
          grep -q 'superuser' api-super.log
          NODE_ENV=production RELEASE=ci DATABASE_URL="postgres://adulis_worker:${ADULIS_DB_WORKER_PASSWORD}@127.0.0.1:55440/adulis_rebuild" \
            node dist/worker.js > worker.log 2>&1 &
          WORKER_PID=$!
          for _ in $(seq 1 30); do grep -q 'worker ready' worker.log && break; sleep 1; done
          grep -q 'worker ready' worker.log
          kill -TERM "$WORKER_PID"; wait "$WORKER_PID"; echo "worker exited $?"
          # The worker refuses an evicting (cache) Valkey as its queue.
          if NODE_ENV=production QUEUE_VALKEY_URL="$CACHE_VALKEY_URL" DATABASE_URL="postgres://adulis_worker:${ADULIS_DB_WORKER_PASSWORD}@127.0.0.1:55440/adulis_rebuild" timeout 20 node dist/worker.js > worker-cache.log 2>&1; then
            echo "worker accepted an evicting queue"; exit 1
          fi
          grep -q 'noeviction' worker-cache.log

      - name: Generated contract is current (committed copies are generator output)
        run: |
          status="$(git status --porcelain -- contracts/openapi.json packages/api-client/src/schema.d.ts)"
          if [ -n "$status" ]; then
            echo "$status"; git --no-pager diff --stat -- contracts/openapi.json packages/api-client/src/schema.d.ts || true
            echo "The committed contract/client differ from the generator output: commit the 'generated-contract' artifact."
            exit 1
          fi

      - name: Retired architecture absent
        run: pnpm verify:retired

      - name: Service logs on failure
        if: failure()
        run: for f in apps/api/*.log; do echo "== $f"; cat "$f"; done 2>/dev/null || true
