# Marketplace Search (WO-008) against the real local API, as a guest: open Search from Home,
# type a query, switch tabs, open a Product, a Seller and a Scene and come back each time to the
# same query; no results offer the Shop. Real public data only; no suggestion, cart or tracking.
#
# Needs the WO-CAT-001 native fixtures (Fixture Weaves: Woven basket, Cotton scarf (out of stock),
# Clay cup, Coffee tray; Scenes "Morning light on the new baskets..." and one more) and the WO-007
# fixtures (Fixture Pottery, 32 "Shop item NN"). Market B has another fixture-weaves whose Woven
# basket is 5,000.00: never shown here.
#
#   maestro test .maestro/search.yaml
appId: com.adulis.app
name: Marketplace Search
tags:
  - buyer
  - search
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_LOCAL_NETWORK: allow
- extendedWaitUntil:
    visible: For You Scenes
    timeout: 120000
# Right after a font-scale change the first tap can be swallowed (Android): tap until it lands.
- repeat:
    while:
      notVisible: Find Products, Sellers and Scenes in your Market\.
    times: 5
    commands:
      - tapOn:
          text: Search
          index: 0
      - waitForAnimationToEnd
- assertVisible:
    id: search-input
- takeScreenshot: search-01-start

# Top: Products and Scenes of the Buyer's Market for "basket".
- tapOn:
    id: search-input
- inputText: basket
- extendedWaitUntil:
    visible: 'Woven basket, .*900\.00.*1,200\.00, Available, Sold by Fixture Weaves'
    timeout: 30000
- assertVisible: 'Scene: Morning light on the new baskets.*'
- assertNotVisible: '.*5,000\.00.*'
- hideKeyboard
- takeScreenshot: search-02-top

# Products tab -> a Product -> Back to the same query.
- tapOn:
    id: search-tab-PRODUCT_POST
- extendedWaitUntil:
    visible: 'Woven basket, .*'
    timeout: 30000
- assertVisible: Sold by Fixture Weaves
- takeScreenshot: search-03-products
- tapOn: 'Woven basket, .*'
- extendedWaitUntil:
    visible:
      id: product-seller
    timeout: 30000
- back
- extendedWaitUntil:
    visible: 'Woven basket, .*'
    timeout: 30000
- assertVisible: basket

# Scenes tab -> a Scene -> Back.
- tapOn:
    id: search-tab-SCENE_POST
- extendedWaitUntil:
    visible: 'Scene: Morning light on the new baskets.*'
    timeout: 30000
- takeScreenshot: search-04-scenes
- tapOn: 'Scene: Morning light on the new baskets.*'
- extendedWaitUntil:
    visible: Products in this Scene
    timeout: 30000
- back
- extendedWaitUntil:
    visible: 'Scene: Morning light on the new baskets.*'
    timeout: 30000

# Sellers tab with a Seller query -> a Seller -> Back.
- tapOn:
    id: search-clear
# Typing straight after the clear tap can drop the first keystroke: focus the field first.
- tapOn:
    id: search-input
- inputText: fixture
- tapOn:
    id: search-tab-SELLER
- extendedWaitUntil:
    visible: 'Fixture Weaves, @fixture-weaves, Trust level: .*'
    timeout: 30000
- assertVisible: 'Fixture Pottery, @fixture-pottery(, Trust level: .*)?'
- hideKeyboard
- takeScreenshot: search-05-sellers
- tapOn: 'Fixture Weaves, @fixture-weaves, Trust level: .*'
- extendedWaitUntil:
    visible: '@fixture-weaves'
    timeout: 30000
- back
- extendedWaitUntil:
    visible: 'Fixture Weaves, @fixture-weaves, Trust level: .*'
    timeout: 30000

# No results: an honest message and a way to the Shop.
- tapOn:
    id: search-clear
# Typing straight after the clear tap can drop the first keystroke: focus the field first.
- tapOn:
    id: search-input
- inputText: zzqx
- extendedWaitUntil:
    visible: No results for "zzqx"\.
    timeout: 30000
- hideKeyboard
- takeScreenshot: search-06-none
- tapOn: Go to Shop
- extendedWaitUntil:
    visible: Newest first
    timeout: 30000
