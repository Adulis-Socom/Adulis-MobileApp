# Explore the Scene (WO-005) in Dark mode, for the record (run it once at font scale 1.0 and
# once at 1.3: `adb shell settings put system font_scale 1.3`). Every role follows the theme;
# large text wraps, nothing clips. Fixtures and prerequisites: buyer-scene-explorer.yaml.
appId: com.adulis.app
name: Buyer Explore the Scene - Dark mode
tags:
  - buyer
  - scene
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_LOCAL_NETWORK: allow
- extendedWaitUntil:
    visible: For You Scenes
    timeout: 120000
- tapOn: You
- tapOn: Dark
- tapOn: Home
- extendedWaitUntil:
    visible: For You Scenes
    timeout: 10000
- scrollUntilVisible:
    element: Explore the Scene
    direction: DOWN
- tapOn:
    text: Explore the Scene
    index: 0
- extendedWaitUntil:
    visible: Products in this Scene
    timeout: 30000
- takeScreenshot: dark-01-explorer
- scrollUntilVisible:
    element: '2\. Cotton scarf.*'
    direction: DOWN
- tapOn: '2\. Cotton scarf.*'
- scrollUntilVisible:
    element: View Product
    direction: DOWN
- takeScreenshot: dark-02-selected
- tapOn: View Product
- extendedWaitUntil:
    visible: Shemma cotton with a woven border.
    timeout: 30000
- takeScreenshot: dark-03-product
- back
- back
- tapOn: You
- tapOn: System
- tapOn: Home
- assertVisible: For You Scenes
