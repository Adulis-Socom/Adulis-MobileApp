# Foundation smoke (WO-001, WO-001A; diagnostics moved to /dev in WO-002) against the Adulis
# DEVELOPMENT build, com.adulis.app: the Buyer shell loads, You offers Developer diagnostics
# (development builds only), every diagnostic mode shell is reachable from there, switching
# keeps the one session (no sign-in surface, session line unchanged), and Amharic renders
# from the real mobile catalogue. A release build has none of this; buyer-shell.yaml is the
# product flow.
#
# Prerequisites: the debug build installed (`pnpm --filter @adulis/mobile android`) and
# Metro serving on 8081.
# clearState makes each run independent: no stored session, no leftover locale or mode.
# ACCESS_LOCAL_NETWORK is the ONE grant: Android 17 blocks a debug build's traffic to Metro
# without it. Only React Native's debug manifest declares it and only debug code asks for it,
# so release builds never prompt. Any other permission dialog would still fail this flow.
appId: com.adulis.app
name: Foundation smoke
tags:
  - foundation
---
- launchApp:
    clearState: true
    permissions:
      android.permission.ACCESS_LOCAL_NETWORK: allow
- extendedWaitUntil:
    visible: 'For You Scenes|There are no Scenes to show right now\. Pull down to check again\.'
    timeout: 120000
- tapOn: You
- tapOn: Developer diagnostics
- assertVisible: Development builds only. Not product UI.
- assertVisible: 'Session: signed out'
- tapOn: Open Seller Companion
- assertVisible: Seller Companion foundation ready
- assertVisible: 'Active mode: Seller Companion'
- assertVisible: 'Session: signed out'
- tapOn: Switch to Courier
- assertVisible: Courier foundation ready
- assertVisible: 'Active mode: Courier'
- assertVisible: 'Session: signed out'
- tapOn: Back to diagnostics
- assertVisible: Development builds only. Not product UI.
- tapOn: Amharic
- assertVisible: 'አንዳንድ ሲስተሞች አይገኙም። እየተመለከትነው ነው።'
- tapOn: English
- assertVisible: 'Some systems are unavailable. We are looking into it.'
